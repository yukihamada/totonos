name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller hpki_bridge.spec --clean

      - name: Create DMG
        run: |
          hdiutil create -volname 'HPKI Bridge' -srcfolder 'dist/HPKI Bridge.app' -ov -format UDZO hpki-bridge-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hpki-bridge-macos
          path: hpki-bridge-macos.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows exe
        run: |
          pyinstaller hpki_bridge.spec --clean

      - name: Rename output
        run: |
          copy "dist\HPKI Bridge.exe" hpki-bridge-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hpki-bridge-windows
          path: hpki-bridge-windows.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: hpki-bridge-macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: hpki-bridge-windows

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            hpki-bridge-macos.dmg
            hpki-bridge-windows.exe
          generate_release_notes: true
